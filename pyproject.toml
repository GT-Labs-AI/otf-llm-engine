[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otf-llm"
version = "2.1.1"
authors = [
    { name = "Gleb Tikhiy", email = "team.gtlabs@gmail.com" },
    { name = "GT Labs AI", email = "team.gtlabs@gmail.com" }
]
description = "On-The-Fly Weight Synthesizer (OTF-LLM Engine) for ultra-fast, low-VRAM LLM inference with Fused Triton INT4 kernels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "quantization", "triton", "cuda", "vram-optimization", "deep-learning", "fastapi"]

dependencies = [
    "torch>=2.0.0",
    "triton>=2.1.0; sys_platform != 'win32'",
    "triton-windows; sys_platform == 'win32'",
    "transformers>=4.38.0",
    "safetensors>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0"
]

[project.urls]
Homepage = "https://github.com/GT-Labs-AI/otf-llm-engine"
Repository = "https://github.com/GT-Labs-AI/otf-llm-engine"